name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  validate-lock:
    name: Validate dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
      - name: Require committed dependency lock
        shell: bash
        run: test -f uv.lock || { echo 'uv.lock is required; run: uv lock'; exit 1; }
      - name: Verify lock is current
        run: uv lock --check

  quality:
    needs: validate-lock
    name: Quality / Linux / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check bundle_repo.py tests scripts
      - name: Ruff format check
        run: uv run ruff format --check bundle_repo.py tests scripts
      - name: Pyrefly
        run: uv run pyrefly check
      - name: Traceability structure
        run: uv run python scripts/traceability.py --check
      - name: Tests and branch coverage
        run: >-
          uv run python -m pytest tests
          --cov=bundle_repo
          --cov-branch
          --cov-context=test
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=75
          --no-cov-on-fail

  test-platforms:
    needs: validate-lock
    name: Tests / ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Run tests
        run: uv run python -m pytest tests

  package:
    name: Build / consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [quality, test-platforms]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --locked
      - name: Build distributions
        run: uv build --no-sources
      - name: Consumer smoke test
        run: uv run python scripts/consumer_smoke.py
