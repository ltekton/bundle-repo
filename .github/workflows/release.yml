name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  release:
    name: Verify / build / release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Verify tag matches package version
        run: uv run python scripts/check_version.py --tag "${{ github.ref_name }}"
      - name: Static quality gates
        run: |
          uv run ruff check bundle_repo.py tests scripts
          uv run ruff format --check bundle_repo.py tests scripts
          uv run pyrefly check
          uv run python scripts/traceability.py --check
      - name: Test with branch coverage
        run: >-
          uv run python -m pytest tests
          --cov=bundle_repo
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=75
          --no-cov-on-fail
      - name: Build distributions
        run: uv build --no-sources
      - name: Consumer smoke test
        run: uv run python scripts/consumer_smoke.py
      - name: Generate SHA-256 checksums
        run: uv run python scripts/checksums.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
